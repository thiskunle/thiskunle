<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Adekunle Akeju, Software Developer and Cybersecurity Analyst">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, "Liberation Mono", monospace; }
  </style>
  <rect x="1" y="1" width="1198" height="318" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="56" y="76" font-size="18"><tspan fill="#3fb950">ade@grambyte</tspan><tspan fill="#8b949e">:~$ whoami</tspan></text>
  <text x="56" y="152" font-size="58" font-weight="700" fill="#f0f6fc">Adekunle Akeju</text>
  <text x="56" y="200" font-size="22" fill="#c9d1d9">Software Developer / Cybersecurity Analyst</text>
  <text x="56" y="238" font-size="18" fill="#8b949e">Founder, GramByte Technologies Inc. · Toronto</text>

  <g transform="translate(640 54)">
    <rect width="512" height="212" rx="10" fill="#161b22" stroke="#30363d"/>
    <path d="M0 10a10 10 0 0 1 10-10h492a10 10 0 0 1 10 10v30H0z" fill="#21262d"/>
    <text x="18" y="26" font-size="15" fill="#c9d1d9">auth/login.js</text>
    <text x="494" y="26" font-size="15" text-anchor="end"><tspan fill="#3fb950">+1</tspan> <tspan fill="#f85149">-1</tspan></text>

    <text x="36" y="72" font-size="15" fill="#8b949e">const pw = req.body.password</text>

    <rect x="1" y="84" width="510" height="30" fill="#f85149" fill-opacity="0.15"/>
    <text x="18" y="104" font-size="15" fill="#ffa198">- if (pw === user.password) login(user)</text>

    <rect x="1" y="114" width="510" height="30" fill="#3fb950" fill-opacity="0.15"/>
    <text x="18" y="134" font-size="15" fill="#7ee787">+ if (await bcrypt.compare(pw, user.hash)) login(user)</text>

    <text x="36" y="166" font-size="15" fill="#8b949e">else audit.log('failed_login', req.ip)</text>
    <text x="36" y="196" font-size="15" fill="#6e7681">// build it. test it. fix it.</text>
  </g>
</svg>
