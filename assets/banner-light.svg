<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Adekunle Akeju, Software Developer and Cybersecurity Analyst">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, "Liberation Mono", monospace; }
  </style>
  <rect x="1" y="1" width="1198" height="318" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="56" y="76" font-size="18"><tspan fill="#1a7f37">ade@grambyte</tspan><tspan fill="#57606a">:~$ whoami</tspan></text>
  <text x="56" y="152" font-size="58" font-weight="700" fill="#1f2328">Adekunle Akeju</text>
  <text x="56" y="200" font-size="22" fill="#32383f">Software Developer / Cybersecurity Analyst</text>
  <text x="56" y="238" font-size="18" fill="#57606a">Founder, GramByte Technologies Inc. · Toronto</text>

  <g transform="translate(640 54)">
    <rect width="512" height="212" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <path d="M0 10a10 10 0 0 1 10-10h492a10 10 0 0 1 10 10v30H0z" fill="#eaeef2"/>
    <text x="18" y="26" font-size="15" fill="#32383f">auth/login.js</text>
    <text x="494" y="26" font-size="15" text-anchor="end"><tspan fill="#1a7f37">+1</tspan> <tspan fill="#cf222e">-1</tspan></text>

    <text x="36" y="72" font-size="15" fill="#57606a">const pw = req.body.password</text>

    <rect x="1" y="84" width="510" height="30" fill="#cf222e" fill-opacity="0.12"/>
    <text x="18" y="104" font-size="15" fill="#a40e26">- if (pw === user.password) login(user)</text>

    <rect x="1" y="114" width="510" height="30" fill="#1a7f37" fill-opacity="0.12"/>
    <text x="18" y="134" font-size="15" fill="#116329">+ if (await bcrypt.compare(pw, user.hash)) login(user)</text>

    <text x="36" y="166" font-size="15" fill="#57606a">else audit.log('failed_login', req.ip)</text>
    <text x="36" y="196" font-size="15" fill="#6e7781">// build it. test it. fix it.</text>
  </g>
</svg>
